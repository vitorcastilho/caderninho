<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protótipo 01 — Login | Caderninho</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Design Tokens ── */
    :root {
      --bg: #FAFAF9;
      --surface: #FFFFFF;
      --border: #E7E5E4;
      --border-hover: #D6D3D1;
      --text-primary: #1C1917;
      --text-secondary: #78716C;
      --text-tertiary: #A8A29E;
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --primary-light: #EEF2FF;
      --radius-card: 12px;
      --radius-input: 6px;
      --radius-badge: 100px;
      --shadow-card: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
      --shadow-card-lg: 0 2px 6px rgba(0,0,0,.06), 0 8px 32px rgba(0,0,0,.06);
      --transition: 150ms ease;
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-variant-numeric: tabular-nums;
      background: var(--bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Page Header ── */
    .page-header {
      text-align: center;
      padding: 48px 24px 40px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .page-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .page-header p {
      font-size: 15px;
      color: var(--text-secondary);
    }

    /* ── Showcase Grid ── */
    .showcase {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 64px;
      padding: 56px 32px 80px;
      flex-wrap: wrap;
    }

    .showcase-column {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .showcase-column-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 20px;
    }

    /* ── Phone Frame ── */
    .phone-frame {
      width: 390px;
      min-height: 780px;
      background: var(--surface);
      border-radius: 40px;
      border: 6px solid #1C1917;
      overflow: hidden;
      position: relative;
      box-shadow: 0 8px 40px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.06);
    }
    .phone-frame::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 28px;
      background: #1C1917;
      border-radius: 0 0 16px 16px;
      z-index: 10;
    }
    .phone-screen {
      padding: 56px 28px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 768px;
    }

    /* ── Desktop Frame ── */
    .desktop-frame {
      width: 900px;
      min-height: 600px;
      background: var(--bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow-card-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .desktop-frame::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 36px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .desktop-frame::after {
      content: '';
      position: absolute;
      top: 12px;
      left: 14px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #E7E5E4;
      box-shadow: 18px 0 0 #E7E5E4, 36px 0 0 #E7E5E4;
    }
    .desktop-content {
      padding: 56px 40px 40px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 564px;
    }

    /* ── Login Card (shared) ── */
    .login-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .desktop-frame .login-card {
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: 44px 40px 40px;
    }

    /* ── Logo ── */
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #FFFFFF;
    }
    .logo-text {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }
    .tagline {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 36px;
    }

    /* ── Form ── */
    .login-form {
      width: 100%;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .input-wrapper {
      position: relative;
    }
    .form-input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: var(--text-primary);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .form-input::placeholder {
      color: var(--text-tertiary);
    }
    .form-input:hover {
      border-color: var(--border-hover);
    }
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, .12);
    }
    .input-wrapper .toggle-password {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: color var(--transition);
    }
    .input-wrapper .toggle-password:hover {
      color: var(--text-secondary);
    }
    .input-wrapper .toggle-password svg {
      width: 18px;
      height: 18px;
    }

    /* ── Buttons ── */
    .btn-primary {
      width: 100%;
      height: 44px;
      background: var(--primary);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-input);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      box-shadow: 0 2px 8px rgba(79, 70, 229, .25);
    }
    .btn-primary:active {
      transform: scale(0.98);
    }

    .link-forgot {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-secondary);
      text-decoration: none;
      cursor: pointer;
      transition: color var(--transition);
    }
    .link-forgot:hover {
      color: var(--primary);
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 28px 0;
      width: 100%;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider span {
      font-size: 12px;
      color: var(--text-tertiary);
      text-transform: lowercase;
    }

    /* ── Google Button ── */
    .btn-google {
      width: 100%;
      height: 44px;
      background: var(--surface);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: border-color var(--transition), background var(--transition), box-shadow var(--transition);
    }
    .btn-google:hover {
      border-color: var(--border-hover);
      background: #FAFAF9;
      box-shadow: 0 1px 4px rgba(0,0,0,.04);
    }
    .btn-google:active {
      transform: scale(0.98);
    }
    .btn-google .g-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* ── Footer ── */
    .login-footer {
      margin-top: 32px;
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
    }
    .login-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      transition: color var(--transition);
    }
    .login-footer a:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }

    /* ── Responsive ── */
    @media (max-width: 1400px) {
      .showcase {
        flex-direction: column;
        align-items: center;
        gap: 48px;
      }
    }
    @media (max-width: 960px) {
      .desktop-frame {
        width: 100%;
        max-width: 900px;
      }
    }
  </style>
</head>
<body>

  <!-- Page Header -->
  <header class="page-header">
    <h1>Prototipo 01 — Login</h1>
    <p>Telas de autenticacao do Caderninho</p>
  </header>

  <!-- Showcase -->
  <section class="showcase">

    <!-- ============ MOBILE ============ -->
    <div class="showcase-column">
      <span class="showcase-column-label">Mobile — 390 px</span>
      <div class="phone-frame">
        <div class="phone-screen">
          <div class="login-card">

            <!-- Logo -->
            <div class="logo">
              <div class="logo-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
                  <path d="M8 7h6"/>
                  <path d="M8 11h4"/>
                </svg>
              </div>
              <span class="logo-text">Caderninho</span>
            </div>
            <p class="tagline">Suas financas, com clareza</p>

            <!-- Form -->
            <form class="login-form" onsubmit="return false;">
              <div class="form-group">
                <label for="mobile-email">E-mail</label>
                <div class="input-wrapper">
                  <input
                    id="mobile-email"
                    class="form-input"
                    type="email"
                    placeholder="voce@exemplo.com"
                    autocomplete="email"
                  />
                </div>
              </div>

              <div class="form-group">
                <label for="mobile-password">Senha</label>
                <div class="input-wrapper">
                  <input
                    id="mobile-password"
                    class="form-input"
                    type="password"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    style="padding-right: 44px;"
                  />
                  <button
                    type="button"
                    class="toggle-password"
                    aria-label="Mostrar senha"
                    onclick="togglePassword('mobile-password', this)"
                  >
                    <!-- Eye icon (visible) -->
                    <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                      <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <!-- Eye-off icon (hidden by default) -->
                    <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                      <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                      <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                      <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                  </button>
                </div>
              </div>

              <button type="submit" class="btn-primary">Entrar</button>
            </form>

            <a href="#" class="link-forgot">Esqueci minha senha</a>

            <div class="divider"><span>ou</span></div>

            <!-- Google -->
            <button type="button" class="btn-google">
              <svg class="g-icon" viewBox="0 0 24 24">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
              </svg>
              Entrar com Google
            </button>

            <div class="login-footer">
              Nao tem conta? <a href="#">Criar conta</a>
            </div>

          </div>
        </div>
      </div>
    </div>

    <!-- ============ DESKTOP ============ -->
    <div class="showcase-column">
      <span class="showcase-column-label">Desktop — 900 px</span>
      <div class="desktop-frame">
        <div class="desktop-content">
          <div class="login-card">

            <!-- Logo -->
            <div class="logo">
              <div class="logo-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
                  <path d="M8 7h6"/>
                  <path d="M8 11h4"/>
                </svg>
              </div>
              <span class="logo-text">Caderninho</span>
            </div>
            <p class="tagline">Suas financas, com clareza</p>

            <!-- Form -->
            <form class="login-form" onsubmit="return false;">
              <div class="form-group">
                <label for="desktop-email">E-mail</label>
                <div class="input-wrapper">
                  <input
                    id="desktop-email"
                    class="form-input"
                    type="email"
                    placeholder="voce@exemplo.com"
                    autocomplete="email"
                  />
                </div>
              </div>

              <div class="form-group">
                <label for="desktop-password">Senha</label>
                <div class="input-wrapper">
                  <input
                    id="desktop-password"
                    class="form-input"
                    type="password"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    style="padding-right: 44px;"
                  />
                  <button
                    type="button"
                    class="toggle-password"
                    aria-label="Mostrar senha"
                    onclick="togglePassword('desktop-password', this)"
                  >
                    <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                      <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                      <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                      <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                      <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                  </button>
                </div>
              </div>

              <button type="submit" class="btn-primary">Entrar</button>
            </form>

            <a href="#" class="link-forgot">Esqueci minha senha</a>

            <div class="divider"><span>ou</span></div>

            <!-- Google -->
            <button type="button" class="btn-google">
              <svg class="g-icon" viewBox="0 0 24 24">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
              </svg>
              Entrar com Google
            </button>

            <div class="login-footer">
              Nao tem conta? <a href="#">Criar conta</a>
            </div>

          </div>
        </div>
      </div>
    </div>

  </section>

  <!-- JavaScript -->
  <script>
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const eyeIcon = btn.querySelector('.icon-eye');
      const eyeOffIcon = btn.querySelector('.icon-eye-off');

      if (input.type === 'password') {
        input.type = 'text';
        eyeIcon.style.display = 'none';
        eyeOffIcon.style.display = 'block';
        btn.setAttribute('aria-label', 'Ocultar senha');
      } else {
        input.type = 'password';
        eyeIcon.style.display = 'block';
        eyeOffIcon.style.display = 'none';
        btn.setAttribute('aria-label', 'Mostrar senha');
      }
    }
  </script>

</body>
</html>
